<text x="174" y="132" font-size="32" font-weight="700" text-anchor="start" fill="#222222" >111</text>
<text x="236" y="124" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >Хорошая геометрия,</text>
<text x="236" y="142" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >но нет источника</text>
<text x="236" y="154" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >искать Scan Tbilisi, TAA,</text>
<text x="236" y="170" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >прессу, Commons</text>
<text x="428.0" y="132" font-size="32" font-weight="700" text-anchor="start" fill="#222222" >28</text>
<text x="490.0" y="124" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >Готово к интеграции</text>
<text x="490.0" y="154" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >проверить перевод и фото</text>
<text x="174" y="286.0" font-size="32" font-weight="700" text-anchor="start" fill="#222222" >109</text>
<text x="236" y="278.0" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >Плохая геометрия</text>
<text x="236" y="296.0" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >и нет источника</text>
<text x="236" y="308.0" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >отложить / вернуться</text>
<text x="236" y="324.0" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >после источников</text>
<text x="428.0" y="286.0" font-size="32" font-weight="700" text-anchor="start" fill="#222222" >25</text>
<text x="490.0" y="278.0" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >Есть источник,</text>
<text x="490.0" y="296.0" font-size="13" font-weight="600" text-anchor="start" fill="#222222" >но плохая геометрия</text>
<text x="490.0" y="308.0" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >обвести корпус вручную</text>
<text x="400.0" y="424" font-size="12" font-weight="600" text-anchor="middle" fill="#666666" >есть независимый источник  →</text>
<text x="400.0" y="72" font-size="12" font-weight="600" text-anchor="middle" fill="#666666" >геометрия: хорошая ↑ / плохая ↓;  источник: нет ← / есть →</text>
