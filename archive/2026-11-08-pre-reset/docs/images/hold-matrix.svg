<text x="30" y="30" font-size="18" font-weight="600" text-anchor="start" fill="#222222" >Матрица приоритетов: геометрия × независимый источник</text>
<text x="30" y="46" font-size="12" font-weight="normal" text-anchor="start" fill="#666666" >273 HOLD; в квадрантах — количество объектов и следующий шаг</text>
