# Playwright MCP for the DeepSeek Harness web profile — the opt-in global overlay.
#
# scripts/run-deepseek-web.sh loads this file as a --patch overlay only with
# ATLAS_DISABLE_MCP=0; by default the browser tools live in the `tester` agent
# preset and the main session has none.
- insert:
    - id: mcp-playwright
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: playwright
        transport: stdio
        command: playwright-mcp
        args:
          - --headless
          - --config
          - /opt/atlas-browser/mcp.config.json
        env:
          PLAYWRIGHT_BROWSERS_PATH: /opt/playwright-browsers
          PLAYWRIGHT_MCP_CONFIG: /opt/atlas-browser/mcp.config.json
